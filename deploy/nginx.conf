# Ting Ting Soft landing page — static site for tingtingsoft.vn (repo 4rankng/ttsoft).
# Files come baked into the image at /usr/share/nginx/html (Vite dist/); the
# Caddy edge on the prod server reverse-proxies tingtingsoft.vn -> 172.17.0.1:8082.
# Security headers and caching follow the contract in the repo's netlify.toml.
#
# Every location re-includes ttsoft-headers.conf: nginx drops server-level
# add_header entries inside any location that defines its own add_header.

server {
	listen 80 default_server;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;
	charset utf-8;

	# Hashed build assets: immutable (netlify.toml). A missing asset 404s —
	# never fall back to HTML, or a browser would pin an HTML body under an
	# immutable asset URL.
	location /assets/ {
		include /etc/nginx/ttsoft-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# OG image referenced by the <meta> tags — long-lived, revalidate occasionally.
	location = /og-image.jpg {
		include /etc/nginx/ttsoft-headers.conf;
		add_header Cache-Control "public, max-age=86400, must-revalidate" always;
	}

	# Netlify platform file copied into dist/ by the build; not site content.
	location = /_redirects {
		return 404;
	}

	# HTML: revalidate often so content updates roll out quickly (netlify.toml).
	# Extension-less links (/policies, /cam-on, /ttransport) resolve to their
	# .html file; unknown paths fall back to /index.html (the _redirects SPA rule).
	location ~* \.html$ {
		include /etc/nginx/ttsoft-headers.conf;
		add_header Cache-Control "public, max-age=300, must-revalidate" always;
		try_files $uri /index.html;
	}

	location / {
		include /etc/nginx/ttsoft-headers.conf;
		add_header Cache-Control "public, max-age=0, must-revalidate" always;
		try_files $uri $uri.html $uri/index.html /index.html;
	}
}
