# Security headers for tingtingsoft.vn — contract from the repo's netlify.toml.
# Included by every location block in nginx.conf: nginx drops server-level
# add_header entries inside locations that define their own, so the set is
# repeated per location via this file. The CSP pins fetches to this origin
# plus cdnjs.cloudflare.com (GSAP) and inline styles (Tailwind v4 layers).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
